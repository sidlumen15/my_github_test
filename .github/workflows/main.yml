name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install PHP for testing (PHP 8.4)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3
          coverage: none

      # 3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 4. Install PHP dependencies
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      # 5. Prepare Laravel environment
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      # 6. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 7. Compile CSS and JavaScript
      - name: Build frontend assets
        run: npm run build

      # 8. Run database migrations
      - name: Run database migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      # 9. Run Laravel tests
      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    # Deploy ONLY when code is pushed or merged directly into master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install PHP matching the DockHosting environment (PHP 8.3)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3
          coverage: none

      # 3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 4. Install production PHP dependencies (ignoring local 8.4 constraints safely)
      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-reqs

      # 5. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6. Build production frontend assets
      - name: Build frontend assets
        run: npm run build

      # 7. Setup the SSH key inside the runner environment natively
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: 'unnecessary'
          if_key_exists: replace

      # 8. Deploy application files via Native Linux Rsync
      - name: Deploy application files via native rsync
        run: |
          rsync -avzr --delete --progress \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='storage/' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:./

      # 9. Run Laravel commands on the server
      - name: Run Laravel deployment commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ./
            php artisan migrate --force
            php artisan optimize
